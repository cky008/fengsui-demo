    <!-- 1. Login -->
    <main id="loginView" class="hidden relative min-h-dvh flex items-center justify-center p-6">
      <div class="absolute right-4 top-4 flex items-center gap-1">
        <button type="button" data-action="toggle-locale" class="btn btn-ghost btn-sm rounded-lg gap-1.5 font-normal text-base-content/70">
          <svg class="ico text-base"><use href="#i-languages" /></svg><span data-locale-label>EN</span>
        </button>
        <button type="button" data-action="open-appearance" class="btn btn-ghost btn-sm btn-square rounded-lg text-base-content/70" data-i18n-title="nav.appearance" data-i18n-aria="nav.appearance">
          <svg class="ico text-lg"><use href="#i-palette" /></svg>
        </button>
      </div>
      <div class="w-full max-w-sm anim-pop-in">
        <div class="flex flex-col items-center text-center mb-8">
          <svg class="fs-mark size-16" aria-hidden="true"><use href="#i-mark" /></svg>
          <h1 class="mt-5 serif text-3xl font-bold tracking-wide"><span data-i18n="app.brand">烽燧</span> <span class="text-base font-normal muted tracking-normal">FengSui</span></h1>
          <p class="mt-2 text-sm muted" data-i18n="login.subtitle">华为 5G CPE Ultra 6 · 私有化射频监控、控制与短信中心</p>
        </div>
        <form id="loginForm" class="fs-card p-5 space-y-4" novalidate>
          <div id="loginModeNote" class="hidden space-y-1.5">
            <p id="loginModeText" class="text-xs muted leading-relaxed"></p>
            <code id="loginModeCommand" class="block font-mono text-[0.6875rem] leading-relaxed rounded-lg bg-base-200/70 px-2.5 py-1.5 whitespace-nowrap overflow-x-auto select-all"></code>
          </div>
          <label id="loginCodeRow" class="hidden field-soft h-11">
            <svg class="ico"><use href="#i-shield" /></svg>
            <input id="loginCode" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="16" data-i18n-placeholder="login.setup_code" />
          </label>
          <label class="field-soft h-11">
            <svg class="ico"><use href="#i-key" /></svg>
            <input id="loginToken" type="password" autocomplete="current-password" required data-i18n-placeholder="login.placeholder" />
          </label>
          <label id="loginConfirmRow" class="hidden field-soft h-11">
            <svg class="ico"><use href="#i-key" /></svg>
            <input id="loginConfirm" type="password" autocomplete="new-password" data-i18n-placeholder="login.confirm_password" />
          </label>
          <div id="loginError" class="hidden text-sm text-error" role="alert"></div>
          <button id="loginSubmit" type="submit" class="btn btn-primary w-full rounded-xl" data-i18n="login.submit">进入控制台</button>
          <button id="loginModeToggle" type="button" class="btn btn-ghost btn-xs w-full font-normal text-base-content/60" data-i18n="login.forgot">忘记密码？</button>
        </form>
        <p class="mt-5 text-xs text-center faint flex items-start justify-center gap-1.5 px-2">
          <svg class="ico mt-0.5"><use href="#i-shield" /></svg><span data-i18n="login.note">会话仅保存在此浏览器</span>
        </p>
      </div>
    </main>

    <!-- 2. Application -->
    <div id="appView" class="hidden min-h-dvh flex flex-col">
      <header class="fs-header sticky top-0 z-30">
        <div class="mx-auto max-w-[1600px] px-3 sm:px-5 h-14 flex items-center gap-2 sm:gap-3">
          <div class="flex items-center gap-2.5 min-w-0 shrink-0">
            <svg class="fs-mark size-9 shrink-0" aria-hidden="true"><use href="#i-mark" /></svg>
            <div class="leading-tight hidden sm:block">
              <div class="serif font-bold text-[1.05rem] tracking-wide"><span data-i18n="app.brand">烽燧</span> <span class="font-sans font-semibold text-[0.7rem] muted tracking-normal">FengSui</span></div>
              <div class="text-[0.65rem] faint num min-h-[1em]" id="versionLabel"></div>
            </div>
          </div>
          <nav class="fs-seg ml-1 sm:ml-3 shrink-0" aria-label="views">
            <button type="button" data-view="dashboard" class="is-active" data-i18n-aria="nav.dashboard"><svg class="ico"><use href="#i-activity" /></svg><span class="hidden sm:inline" data-i18n="nav.dashboard">监控大屏</span></button>
            <button type="button" data-view="sms" data-i18n-aria="nav.sms"><svg class="ico"><use href="#i-message" /></svg><span class="hidden sm:inline" data-i18n="nav.sms">短信中心</span><span id="smsUnreadBadge" class="hidden badge badge-xs badge-secondary num rounded-full"></span></button>
          </nav>
          <div class="ml-auto flex items-center gap-0 sm:gap-1.5">
            <button type="button" id="readOnlyBadge" data-action="open-device" class="fs-pill fs-readonly hidden cursor-pointer" data-tone="warn">
              <svg class="ico"><use href="#i-lock" /></svg><span class="hidden sm:inline" data-role="text"></span>
            </button>
            <span id="sessionPill" class="fs-pill hidden md:inline-flex" data-tone="busy"><span class="fs-dot"></span><span data-role="text"></span></span>
            <span id="ssePill" class="fs-pill hidden lg:inline-flex"><span class="fs-dot"></span><span data-role="text"></span></span>
            <button type="button" id="controlsBtn" data-action="open-controls" class="btn btn-ghost btn-sm rounded-lg gap-1.5 font-normal" data-i18n-title="nav.controls">
              <svg class="ico text-base"><use href="#i-sliders" /></svg><span class="hidden xl:inline" data-i18n="nav.controls">控制</span>
            </button>
            <button type="button" id="alertsBtn" data-action="open-alerts" class="btn btn-ghost btn-sm btn-square rounded-lg relative" data-i18n-title="nav.alerts" data-i18n-aria="nav.alerts">
              <svg class="ico text-base"><use href="#i-bell" /></svg>
              <span id="alertsBadge" class="hidden absolute -top-0.5 -right-0.5 badge badge-xs badge-warning num rounded-full px-1"></span>
            </button>
            <button type="button" data-action="open-mcp-guide" class="btn btn-ghost btn-sm btn-square rounded-lg hidden sm:inline-flex" data-i18n-title="nav.mcp" data-i18n-aria="nav.mcp">
              <svg class="ico text-base"><use href="#i-bot" /></svg>
            </button>
            <button type="button" id="privacyBtn" data-action="toggle-privacy" class="btn btn-ghost btn-sm btn-square rounded-lg">
              <svg class="ico text-base"><use href="#i-eye-off" /></svg>
            </button>
            <button type="button" data-action="toggle-locale" class="btn btn-ghost btn-sm rounded-lg px-2 font-normal hidden sm:inline-flex" data-i18n-title="nav.language">
              <svg class="ico text-base"><use href="#i-languages" /></svg><span class="text-xs" data-locale-label>EN</span>
            </button>
            <button type="button" data-action="open-appearance" class="btn btn-ghost btn-sm btn-square rounded-lg" data-i18n-title="nav.appearance" data-i18n-aria="nav.appearance">
              <svg class="ico text-base"><use href="#i-palette" /></svg>
            </button>
            <button type="button" data-action="open-settings" class="btn btn-ghost btn-sm btn-square rounded-lg" data-i18n-title="nav.settings" data-i18n-aria="nav.settings">
              <svg class="ico text-base"><use href="#i-settings" /></svg>
            </button>
            <a href="https://github.com/sponsors/cky008" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm btn-square rounded-lg hidden sm:inline-flex text-base-content/50 hover:text-error transition-colors" data-i18n-title="nav.sponsor" data-i18n-aria="nav.sponsor">
              <svg class="ico text-base"><use href="#i-heart" /></svg>
            </a>
            <button type="button" data-action="logout" class="btn btn-ghost btn-sm btn-square rounded-lg" data-i18n-title="nav.logout" data-i18n-aria="nav.logout">
              <svg class="ico text-base"><use href="#i-logout" /></svg>
            </button>
          </div>
        </div>
      </header>

      <div id="bannerArea" class="mx-auto w-full max-w-[1600px] px-3 sm:px-5 empty:hidden pt-3 space-y-2"></div>

      <!-- 2a. Dashboard -->
      <main id="dashboardView" class="mx-auto w-full max-w-[1600px] px-3 sm:px-5 py-4 space-y-4">
        <section class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-4 gap-4">
          <article id="operatorCard" class="fs-card"></article>
          <article id="caCard" class="fs-card"></article>
          <article id="identityCard" class="fs-card"></article>
          <article id="networkCard" class="fs-card"></article>
        </section>
        <section class="grid grid-cols-1 xl:grid-cols-12 gap-4">
          <article id="rfCard" class="fs-card xl:col-span-7"></article>
          <div class="xl:col-span-5 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-1 gap-4">
            <article id="trafficCard" class="fs-card"></article>
            <article id="healthCard" class="fs-card"></article>
          </div>
        </section>
        <section id="chartsCard" class="fs-card"></section>
        <section class="grid grid-cols-1 2xl:grid-cols-12 gap-4">
          <article id="neighborsCard" class="fs-card 2xl:col-span-7"></article>
          <article id="topologyCard" class="fs-card 2xl:col-span-5"></article>

          <a href="https://github.com/sponsors/cky008" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 hover:text-error"><svg class="ico"><use href="#i-heart" /></svg><span data-i18n="nav.sponsor_short">赞助</span></a><span>·</span>
          <button type="button" data-action="open-mcp-guide" class="inline-flex items-center gap-1 hover:text-base-content"><svg class="ico"><use href="#i-bot" /></svg><span data-i18n="nav.mcp_short">接入 AI</span></button><span>·</span>
          <a href="https://iocky.com/" target="_blank" rel="noopener noreferrer" class="hover:text-base-content">© 2026 iocky</a>
        </footer>
      </main>

      <!-- 2b. SMS centre -->
      <main id="smsView" class="hidden flex-1 min-h-0 mx-auto w-full max-w-[1600px] px-0 sm:px-5 sm:py-4" data-mobile-view="list">
        <div class="fs-card h-[calc(100dvh-4.5rem)] sm:h-[calc(100dvh-6.5rem)] flex overflow-hidden rounded-none sm:rounded-[1.125rem]">
          <aside id="smsSidebar" class="hidden md:flex w-56 shrink-0 flex-col border-r border-base-content/[0.07] bg-base-200/40 p-3 gap-1"></aside>
          <section id="smsListPane" class="relative flex flex-col w-full md:w-[340px] xl:w-[380px] shrink-0 md:border-r border-base-content/[0.07]"></section>
          <section id="smsChatPane" class="flex flex-1 min-w-0 flex-col"></section>
        </div>
      </main>
    </div>

    <!-- Dialogs -->
    <dialog id="confirmDialog" class="modal modal-bottom sm:modal-middle">
      <div class="modal-box sm:max-w-md">
        <h3 id="confirmTitle" class="text-lg font-bold serif"></h3>
        <div id="confirmBody" class="mt-2 text-sm muted space-y-2"></div>
        <label id="confirmTypeRow" class="hidden mt-4 block">
          <span id="confirmTypeLabel" class="text-xs muted"></span>
          <input id="confirmTypeInput" type="text" class="input input-sm w-full mt-1 rounded-lg" autocomplete="off" />
        </label>
        <div class="modal-action">
          <button type="button" id="confirmCancel" class="btn btn-ghost btn-sm rounded-lg" data-i18n="common.cancel">取消</button>
          <button type="button" id="confirmOk" class="btn btn-sm rounded-lg"></button>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop"><button>close</button></form>
    </dialog>

    <dialog id="appearanceDialog" class="modal modal-bottom sm:modal-middle"></dialog>
    <dialog id="alertsDialog" class="modal modal-bottom sm:modal-middle"></dialog>
